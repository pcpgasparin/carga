<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programação de Cargas</title>

<style>
  /* RESET E ESTILOS GERAIS */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    background: #eef1f6;
    color: #1e2a3a;
    padding: 18px;
    font-size: 15px;
  }

  /* HEADER COM LOGO E CONTROLES */
  header {
    background: linear-gradient(135deg, #1e2a3a 0%, #2b3a4f 100%);
    color: #fff;
    padding: 22px 26px;
    border-radius: 14px;
    margin-bottom: 18px;
    box-shadow: 0 6px 20px rgba(30,42,58,.18);
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 20px;
    position: relative;
  }

  header::after {
    content: "";
    width: 140px;
    height: 1px;
    visibility: hidden;
  }

  .logo-area {
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  .logo {
    max-height: 70px;
    max-width: 140px;
    object-fit: contain;
    border-radius: 8px;
    transition: transform .2s ease;
    background: rgba(255,255,255,.95);
    padding: .5px;
  }

  .logo:hover { transform: scale(1.03); }

  .header-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    text-align: center;
  }

  .header-center h1 {
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: .3px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 0;
  }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
  }

  /* BOTÕES E STATUS */
  .tab {
    background: rgba(255,255,255,.08);
    color: #cfd8e3;
    border: 1px solid rgba(255,255,255,.12);
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: .9rem;
    font-weight: 600;
    transition: all .18s ease;
    font-family: inherit;
  }

  .tab:hover {
    background: rgba(255,255,255,.16);
    color: #fff;
  }

  .tab.active {
    background: #4a90e2;
    color: #fff;
    border-color: #4a90e2;
    box-shadow: 0 3px 10px rgba(74,144,226,.4);
  }

  input[type="date"] {
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.08);
    color: #fff;
    font-family: inherit;
    font-size: .88rem;
  }

  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1);
    cursor: pointer;
  }

  .btn-sec, .btn-nav {
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: .88rem;
    font-family: inherit;
    border: none;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .18s ease;
  }

  .btn-sec {
    background: rgba(255,255,255,.12);
    color: #dfe6ee;
  }

  .btn-sec:hover {
    background: rgba(255,255,255,.22);
    color: #fff;
  }

  .btn-nav { background: #4a90e2; color: #fff; }
  .btn-nav:hover { background: #3a78c2; }

  .status {
    font-size: .82rem;
    padding: 7px 14px;
    border-radius: 20px;
    background: rgba(255,255,255,.1);
    color: #fff;
    font-weight: 600;
  }

  .status.ok { background: rgba(31,122,63,.85); }
  .status.erro { background: rgba(160,48,48,.9); }

  .view { display: none; }
  .view.active { display: block; }

  /* TABELA DETALHADA */
  .table-wrapper {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(30,42,58,.08);
    max-height: 78vh;
    overflow: auto;
    border: 1px solid #e4e9f0;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .92rem;
  }

  thead {
    position: sticky;
    top: 0;
    background: #4a90e2;
    color: #fff;
    z-index: 2;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }

  thead th {
    padding: 13px 16px;
    text-align: left;
    font-weight: 600;
    font-size: .82rem;
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  thead th:nth-child(5),
  thead th:nth-child(6) { text-align: right; }

  tbody td {
    padding: 11px 16px;
    border-bottom: 1px solid #eef2f7;
    vertical-align: middle;
  }

  tbody tr:hover { background: #f5faff; }
  tr.grupo-data td { border-top: 2px solid #4a90e2; }
  tr.grupo-data:first-child td { border-top: none; }

  .data-cell {
    font-weight: 700;
    color: #1e2a3a;
    white-space: nowrap;
    font-size: .9rem;
    position: relative;
    vertical-align: top;
  }

  .data-cell small {
    display: block;
    color: #7a8699;
    font-weight: 500;
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .3px;
    margin-top: 2px;
  }

  .carga-cell {
    font-family: 'Consolas', monospace;
    color: #2a5d9e;
    font-weight: 700;
    font-size: .95rem;
    position: relative;
    white-space: nowrap;
  }

  /* BOTÕES DE AÇÃO DA CARGA */
  .carga-actions {
    display: inline-flex;
    gap: 4px;
    margin-left: 8px;
    opacity: 0;
    transition: opacity .15s;
    vertical-align: middle;
  }
  tr:hover .carga-actions { opacity: 1; }

  .btn-carga-acao {
    background: #f0f4f9;
    border: 1px solid #dbe4ee;
    border-radius: 6px;
    cursor: pointer;
    padding: 3px 6px;
    font-size: .8rem;
    line-height: 1;
    color: #4a5568;
    transition: all .15s;
  }
  .btn-carga-acao:hover {
    background: #e2e8f0;
    color: #1e2a3a;
    transform: scale(1.1);
  }
  .btn-carga-acao.del:hover {
    background: #fbe9e9;
    color: #a03030;
    border-color: #f5c2c2;
  }

  .qtd-cell {
    text-align: right;
    font-weight: 700;
    color: #1f7a3f;
    font-variant-numeric: tabular-nums;
  }

  tbody td:nth-child(6) {
    text-align: right;
    color: #667;
    font-size: .85rem;
    font-weight: 600;
  }

  tbody td:nth-child(3) {
    font-family: 'Consolas', monospace;
    color: #6c7a8c;
    font-size: .85rem;
  }

  tr.inicio-carga td {
    border-top: 1px solid #d9e6f7;
    background: #f9fcff;
  }

  tr.inicio-carga:hover td { background: #f0f7ff; }

  .vazio {
    text-align: center;
    padding: 50px 20px;
    color: #889;
    font-style: italic;
  }

  /* CLIENTE: TOOLTIP E TOAST */
  .has-cliente {
    cursor: pointer;
    text-decoration: underline dotted #4a90e2;
    text-underline-offset: 4px;
    position: relative;
    transition: background .2s;
  }

  .has-cliente:hover {
    background: #eef4fc;
    border-radius: 4px;
  }

  #toastCliente {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #4a90e2;
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: 700;
    font-size: .95rem;
    box-shadow: 0 10px 25px rgba(74,144,226,.4);
    transition: all .4s cubic-bezier(.68,-.55,.265,1.55);
    z-index: 10000;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #toastCliente.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .peso-dia {
    display: inline-block;
    background: #e5f6ec;
    color: #1f7a3f;
    padding: 3px 10px;
    border-radius: 6px;
    font-family: 'Consolas', monospace;
    font-size: .8rem;
    font-weight: 700;
    margin-top: 6px;
    margin-right: 6px;
    border: 1px solid #c8e6d2;
  }

  .badge-peso {
    background: #1f7a3f;
    color: #fff;
    padding: 4px 11px;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 700;
    white-space: nowrap;
    font-family: 'Consolas', monospace;
  }

  /* CARDS DE RESUMO */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .card-dia {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(30,42,58,.08);
    overflow: hidden;
    border-top: 4px solid #4a90e2;
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .card-dia:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(30,42,58,.12);
  }

  .card-dia.filtrado { border-top-color: #f0a13a; }

  .card-header {
    background: #1e2a3a;
    color: #fff;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .card-header > span:first-child {
    font-weight: 700;
    font-size: .95rem;
    line-height: 1.3;
  }

  .card-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-header .badge {
    background: #4a90e2;
    padding: 4px 11px;
    border-radius: 20px;
    font-size: .75rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .card-body { padding: 6px 18px 18px; }

  .produto-linha {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px dashed #e8ecf2;
    gap: 12px;
    font-size: .9rem;
  }

  .produto-linha:last-child { border-bottom: none; }
  
  /* ESTILO PARA PRODUTO ZERADO */
  .produto-linha.zerado .p-nome,
  .produto-linha.zerado .qtd {
    opacity: 0.4;
    text-decoration: line-through;
  }

  .produto-linha .p-nome {
    display: flex;
    flex-direction: column;
    line-height: 1.3;
  }

  /* Nome do produto clicável */
  button.p-nome {
    background: transparent;
    border: none;
    padding: 0;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    border-radius: 4px;
  }

  button.p-nome:hover {
    color: #2a5d9e;
    text-decoration: underline;
  }

  button.p-nome:focus-visible {
    outline: 2px solid #4a90e2;
    outline-offset: 3px;
  }

  button.p-nome.ativo {
    color: #8a5a00;
    background: #fff7e6;
  }

  .produto-linha .p-cod {
    font-family: 'Consolas', monospace;
    color: #7a8699;
    font-size: .72rem;
    font-weight: 600;
    margin-bottom: 1px;
  }

  .produto-linha .qtd {
    font-weight: 700;
    color: #1f7a3f;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    font-size: .95rem;
  }

  .produto-linha .qtd small {
    color: #889;
    font-weight: 600;
    font-size: .72rem;
    margin-left: 3px;
  }

  .cargas-lista {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #eef2f7;
  }

  .cargas-lista h4 {
    font-size: .72rem;
    text-transform: uppercase;
    color: #7a8699;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .cargas-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .carga-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #eef4fc;
    color: #2a5d9e;
    padding: 4px 8px 4px 10px;
    border-radius: 6px;
    font-family: 'Consolas', monospace;
    font-size: .78rem;
    font-weight: 700;
    border: 1px solid #d9e6f7;
    transition: all .15s ease;
    cursor: pointer;
  }

  .carga-tag:hover {
    background: #dbe9fb;
    border-color: #a9c9ef;
  }

  .carga-tag.ativa {
    background: #f0a13a;
    color: #fff;
    border-color: #d98a1f;
    box-shadow: 0 2px 6px rgba(240,161,58,.4);
  }

  .carga-tag .tag-actions {
    display: flex;
    gap: 2px;
    margin-left: 4px;
    border-left: 1px solid rgba(0,0,0,.1);
    padding-left: 4px;
  }

  .carga-tag .tag-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: .7rem;
    padding: 2px;
    border-radius: 3px;
    color: inherit;
    opacity: .6;
    transition: all .15s;
  }
  .carga-tag .tag-btn:hover {
    opacity: 1;
    background: rgba(0,0,0,.1);
  }

  /* FAIXA DE FILTRO ATIVO */
  .filtro-ativo {
    background: #fff7e6;
    border: 1px solid #f5d9a8;
    border-radius: 8px;
    padding: 8px 12px;
    margin: 10px 0 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: .82rem;
    color: #8a5a00;
    font-weight: 600;
  }

  .filtro-ativo button {
    background: #f0a13a;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: .78rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s ease;
  }

  .filtro-ativo button:hover { background: #d98a1f; }

  /* BOTÕES DE LIXEIRA E MODAL */
  .btn-del-dia, .btn-del-dia-card {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    font-size: .95rem;
    opacity: 0;
    transition: all .15s ease;
    line-height: 1;
  }

  tr.grupo-data:hover .btn-del-dia,
  tr:hover .btn-del-dia { opacity: .35; }

  .btn-del-dia:hover {
    opacity: 1 !important;
    background: #fbe9e9;
    transform: scale(1.15);
  }

  .btn-del-dia-card {
    opacity: .55;
    color: #fff;
    font-size: 1rem;
  }

  .btn-del-dia-card:hover {
    opacity: 1;
    background: rgba(160,48,48,.9);
    transform: scale(1.1);
  }

  .data-cell .btn-del-dia {
    margin-left: 6px;
    vertical-align: middle;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,35,.6);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 20px;
    animation: fadeIn .15s ease;
  }

  .modal-box {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
    animation: slideUp .2s ease;
  }

  .modal-header {
    background: #1e2a3a;
    color: #fff;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    font-size: .98rem;
  }

  .modal-close {
    background: transparent;
    border: none;
    color: #cfd8e3;
    cursor: pointer;
    font-size: 1rem;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all .15s;
  }

  .modal-body { padding: 20px; }

  .modal-msg {
    font-size: .9rem;
    color: #445;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .modal-label {
    display: block;
    font-size: .8rem;
    text-transform: uppercase;
    color: #7a8699;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .modal-input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #ccd5e0;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
  }

  .modal-erro {
    color: #a03030;
    font-size: .85rem;
    font-weight: 600;
    margin-top: 8px;
    min-height: 18px;
  }

  .modal-footer {
    padding: 14px 20px 18px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    background: #f9fbfd;
    border-top: 1px solid #eef2f7;
  }

  .btn-sec-modal {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    background: #eef2f7;
    color: #445;
  }

  .btn-danger-modal {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    background: #a03030;
    color: #fff;
  }

  .btn-primary-modal {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    background: #4a90e2;
    color: #fff;
  }
  .btn-primary-modal:hover { background: #3a78c2; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from { transform: translateY(10px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* RESPONSIVIDADE */
  @media (max-width: 900px) {
    header {
      grid-template-columns: 1fr;
      justify-items: center;
      padding: 18px;
    }

    header::after { display: none; }
  }

  @media (max-width: 720px) {
    body { padding: 10px; }
    header { padding: 16px; }
    .header-center h1 { font-size: 1.2rem; }

    thead th, tbody td {
      padding: 9px 10px;
      font-size: .82rem;
    }

    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>

<body>
<header>
  <div class="logo-area">
    <img src="logo.jpg" alt="Logo" class="logo">
  </div>

  <div class="header-center">
    <h1>📦 Programação de Cargas</h1>

    <div class="controls">
      <button id="btnDetalhado" class="tab active">Detalhado</button>
      <button id="btnResumo" class="tab">Resumo por Dia</button>
      <input type="date" id="filtroData" title="Filtrar a partir de">
      <button id="btnLimparFiltro" class="btn-sec">Limpar Filtro</button>
      <button id="btnAtualizar" class="btn-sec">🔄 Atualizar</button>
      <button id="btnLimparPassados" class="btn-sec">
        🧹 Limpar dias passados
      </button>
      <a href="importador.html" class="btn-nav">📥 Importador</a>
      <span id="statusConexao" class="status">🔄 Conectando...</span>
    </div>
  </div>
</header>

<main>
  <section id="viewDetalhado" class="view active">
    <div class="table-wrapper">
      <table id="tabelaDetalhado">
        <thead>
          <tr>
            <th>Data</th>
            <th>Nº Carga</th>
            <th>Cód</th>
            <th>Produto</th>
            <th>Qtd</th>
            <th>Un</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="viewResumo" class="view">
    <div id="cardsResumo" class="cards"></div>
  </section>

  <div id="toastCliente"></div>
</main>

<script type="module">
  import { db } from "./firebase-config.js";

  import {
    collection,
    onSnapshot,
    query,
    orderBy,
    doc,
    deleteDoc,
    writeBatch,
    updateDoc,
    setDoc,
    getDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const SENHA_APAGAR = "pcp";

  // =========================================================
  // DICIONÁRIO DE PESOS POR CÓDIGO DE PRODUTO
  // =========================================================
  const PESOS_PRODUTOS = {
    "671": 10,
    "669": 30,
    "1541": 25,
    "210": 50,
    "670": 30,
    "7697": 25,
    "745": 30,
    "8489": 30,
    "9000": 10,
    "8517": 25,
    "2517": 25,
    "9009": 10,
    "7708": 25,
    "3112": 10,
    "3113": 10,
    "979": 10,
    "8516": 25,
    "0": 30,
    "6377": 1000,
    "730": 25,
    "4864": 30,
    "3235": 30,
    "1688": 30,
    "8487": 30,
    "4852": 10,
    "8488": 30,
    "1691": 30,
    "3114": 30,
    "1690": 30,
    "7677": 1000,
    "7676": 1000,
    "1081": 1000,
    "1018": 1000,
    "1888": 30,
    "7771": 30,
    "8486": 30
  };
  // =========================================================

  let dias = [];
  let mapeamentoClientes = {};
  let mapeamentoGlobal = {};
  
  let viewAtual = "detalhado";
  let filtroData = "";
  let unsubscribe = null;

  let filtroCargaPorDia = {};
  let filtroProdutoPorDia = {};

  const statusEl = document.getElementById("statusConexao");

  /* HELPERS E FORMATAÇÃO */
  const fmtData = (iso) => iso ? iso.split("-").reverse().join("/") : "";

  const diaSemana = (iso) => [
    "Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"
  ][new Date(iso + "T00:00:00").getDay()];

  const hojeISO = () => {
    const d = new Date();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${d.getFullYear()}-${mm}-${dd}`;
  };

  const formatarPeso = (valor) => {
    const num = Number(valor || 0);
    return num.toLocaleString("pt-BR", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  };

  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

  const chaveProduto = (p) => JSON.stringify([
    String(p.codigo ?? ""), String(p.nome ?? ""), String(p.unidade || "")
  ]);

  function obterNomeCliente(dataISO, numCarga) {
    const numStr = String(numCarga);
    if (mapeamentoClientes[dataISO] && mapeamentoClientes[dataISO][numStr]) {
      return mapeamentoClientes[dataISO][numStr];
    }
    return mapeamentoGlobal[numStr] || null;
  }

  /* TOAST DE CLIENTE */
  window.mostrarCliente = function(nome) {
    const toast = document.getElementById("toastCliente");
    toast.textContent = "🏢 " + nome;
    toast.classList.add("show");

    if (window.toastTimeout) clearTimeout(window.toastTimeout);

    window.toastTimeout = setTimeout(() => {
      toast.classList.remove("show");
    }, 3000);
  };

  /* FILTRO DE CARGA */
  window.toggleFiltroCarga = function(dataISO, numCarga) {
    const numStr = String(numCarga);
    if (filtroCargaPorDia[dataISO] === numStr) {
      delete filtroCargaPorDia[dataISO];
    } else {
      filtroCargaPorDia[dataISO] = numStr;
    }
    if (viewAtual === "resumo") renderResumo(getCargasFiltradas());
  };

  window.limparFiltroCarga = function(dataISO) {
    delete filtroCargaPorDia[dataISO];
    if (viewAtual === "resumo") renderResumo(getCargasFiltradas());
  };

  /* FILTRO DE PRODUTO */
  document.getElementById("cardsResumo").addEventListener("click", (event) => {
    const botao = event.target.closest("[data-produto], [data-limpar-produto]");
    if (!botao) return;

    const data = botao.dataset.dia;
    if (botao.hasAttribute("data-limpar-produto") || filtroProdutoPorDia[data] === botao.dataset.produto) {
      delete filtroProdutoPorDia[data];
    } else {
      filtroProdutoPorDia[data] = botao.dataset.produto;
    }
    renderResumo(getCargasFiltradas());
  });

  /* MODAL DE SENHA PARA EXCLUSÃO */
  function pedirSenha(titulo, mensagem) {
    return new Promise((resolve) => {
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";

      overlay.innerHTML = `
        <div class="modal-box" role="dialog" aria-modal="true">
          <div class="modal-header">
            <span>🔒 ${titulo}</span>
            <button class="modal-close" type="button" aria-label="Fechar">✕</button>
          </div>
          <div class="modal-body">
            <p class="modal-msg">${mensagem}</p>
            <label class="modal-label">Senha de administrador</label>
            <input type="password" class="modal-input" id="modalSenhaInput" autocomplete="off" autofocus>
            <div class="modal-erro" id="modalErro"></div>
          </div>
          <div class="modal-footer">
            <button class="btn-sec-modal" type="button" data-cancelar>Cancelar</button>
            <button class="btn-danger-modal" type="button" data-confirmar>Confirmar</button>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);
      const input = overlay.querySelector("#modalSenhaInput");
      const erroEl = overlay.querySelector("#modalErro");

      setTimeout(() => input.focus(), 50);

      function fechar(resultado) {
        overlay.classList.add("fechando");
        setTimeout(() => { overlay.remove(); resolve(resultado); }, 150);
      }

      function tentarConfirmar() {
        if (input.value === SENHA_APAGAR) {
          fechar(true);
        } else {
          erroEl.textContent = "❌ Senha incorreta.";
          input.value = "";
          input.focus();
        }
      }

      overlay.querySelector("[data-confirmar]").addEventListener("click", tentarConfirmar);
      overlay.querySelector("[data-cancelar]").addEventListener("click", () => fechar(false));
      overlay.querySelector(".modal-close").addEventListener("click", () => fechar(false));

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") tentarConfirmar();
        if (e.key === "Escape") fechar(false);
      });
    });
  }

  /* MODAL DE TRANSFERÊNCIA */
  function pedirTransferencia(dataOrigem, numeroCarga) {
    return new Promise((resolve) => {
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";

      overlay.innerHTML = `
        <div class="modal-box" role="dialog" aria-modal="true">
          <div class="modal-header">
            <span>↔ Transferir Carga</span>
            <button class="modal-close" type="button" aria-label="Fechar">✕</button>
          </div>
          <div class="modal-body">
            <p class="modal-msg">Transferir a carga <strong>#${numeroCarga}</strong> do dia <strong>${fmtData(dataOrigem)}</strong> para:</p>
            <label class="modal-label">Nova data</label>
            <input type="date" class="modal-input" id="modalDataInput" min="${hojeISO()}" required>
            <div class="modal-erro" id="modalErro"></div>
          </div>
          <div class="modal-footer">
            <button class="btn-sec-modal" type="button" data-cancelar>Cancelar</button>
            <button class="btn-primary-modal" type="button" data-confirmar>Transferir</button>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);
      const input = overlay.querySelector("#modalDataInput");
      const erroEl = overlay.querySelector("#modalErro");

      setTimeout(() => input.focus(), 50);

      function fechar(resultado) {
        overlay.classList.add("fechando");
        setTimeout(() => { overlay.remove(); resolve(resultado); }, 150);
      }

      function tentarConfirmar() {
        const novaData = input.value;
        if (!novaData) { erroEl.textContent = "❌ Selecione uma data válida."; return; }
        if (novaData === dataOrigem) { erroEl.textContent = "❌ A data de destino não pode ser a mesma."; return; }
        fechar(novaData);
      }

      overlay.querySelector("[data-confirmar]").addEventListener("click", tentarConfirmar);
      overlay.querySelector("[data-cancelar]").addEventListener("click", () => fechar(null));
      overlay.querySelector(".modal-close").addEventListener("click", () => fechar(null));

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") tentarConfirmar();
        if (e.key === "Escape") fechar(null);
      });
    });
  }

  /* INICIALIZAÇÃO DO FIREBASE E LISTENERS */
  function iniciarListener() {
    if (unsubscribe) unsubscribe();

    statusEl.textContent = "🔄 Conectando...";
    statusEl.className = "status";

    unsubscribe = onSnapshot(
      query(collection(db, "cargas"), orderBy("data", "asc")),
      (snap) => {
        dias = snap.docs.map(d => ({
          data: d.id,
          ...d.data()
        }));

        const total = dias.reduce((acc, d) => acc + (d.cargas?.length || 0), 0);
        statusEl.textContent = `🔥 Firebase (${dias.length} dia(s) • ${total} carga(s))`;
        statusEl.className = "status ok";
        render();
      },
      (err) => {
        statusEl.textContent = "🔴 Erro";
        statusEl.className = "status erro";
        console.error(err);
      }
    );

    onSnapshot(doc(db, "configuracoes", "mapeamento_cargas"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        if (data.porData) {
          mapeamentoClientes = data.porData;
          mapeamentoGlobal = data.global || {};
        } else {
          mapeamentoGlobal = data;
          mapeamentoClientes = {};
        }
        render();
      }
    });
  }

  iniciarListener();
  document.getElementById("btnAtualizar").addEventListener("click", iniciarListener);

  /* EXCLUSÃO */
  async function apagarDia(dataISO) {
    const dia = dias.find(d => d.data === dataISO);
    if (!dia || !dia.cargas?.length) return;

    const ok = await pedirSenha("Apagar dia", `Vai apagar TODAS as ${dia.cargas.length} carga(s) de ${fmtData(dataISO)}.`);
    if (ok) {
      try {
        await deleteDoc(doc(db, "cargas", dataISO));
        delete filtroCargaPorDia[dataISO];
        delete filtroProdutoPorDia[dataISO];
      } catch (e) { alert("❌ Erro: " + e.message); }
    }
  }

  async function apagarCarga(dataISO, numeroCarga) {
    const dia = dias.find(d => d.data === dataISO);
    if (!dia) return;

    const novaListaCargas = (dia.cargas || []).filter(c => String(c.numeroCarga) !== String(numeroCarga));

    const ok = await pedirSenha("Apagar Carga", `Vai apagar a carga <strong>#${numeroCarga}</strong> do dia <strong>${fmtData(dataISO)}</strong>.`);

    if (ok) {
      try {
        const docRef = doc(db, "cargas", dataISO);
        if (novaListaCargas.length === 0) {
           await deleteDoc(docRef);
        } else {
           await setDoc(docRef, { cargas: novaListaCargas, atualizadoEm: serverTimestamp() }, { merge: true });
        }
      } catch (e) { alert("❌ Erro ao apagar carga: " + e.message); }
    }
  }

  /* TRANSFERÊNCIA */
  async function transferirCarga(dataOrigem, numeroCarga) {
    const novaData = await pedirTransferencia(dataOrigem, numeroCarga);
    if (!novaData) return;

    const diaOrigem = dias.find(d => d.data === dataOrigem);
    if (!diaOrigem) return;

    const cargaParaMover = (diaOrigem.cargas || []).find(c => String(c.numeroCarga) === String(numeroCarga));
    if (!cargaParaMover) { alert("❌ Carga não encontrada no dia de origem."); return; }

    const calcularPesoTotal = (listaCargas) => listaCargas.reduce((acc, c) => acc + Number(c.pesoLiquido || c.peso || 0), 0);

    try {
      const refOrigem = doc(db, "cargas", dataOrigem);
      const refDestino = doc(db, "cargas", novaData);

      const listaOrigemAtualizada = diaOrigem.cargas.filter(c => String(c.numeroCarga) !== String(numeroCarga));
      
      if (listaOrigemAtualizada.length === 0) {
        await deleteDoc(refOrigem);
      } else {
        const novoPesoOrigem = calcularPesoTotal(listaOrigemAtualizada);
        await setDoc(refOrigem, { cargas: listaOrigemAtualizada, pesoLiquido: novoPesoOrigem, atualizadoEm: serverTimestamp() }, { merge: true });
      }

      const diaDestino = dias.find(d => d.data === novaData);
      let listaDestinoAtualizada = [];
      
      if (diaDestino && diaDestino.cargas) {
        listaDestinoAtualizada = [...diaDestino.cargas, cargaParaMover];
      } else {
        listaDestinoAtualizada = [cargaParaMover];
      }

      const novoPesoDestino = calcularPesoTotal(listaDestinoAtualizada);

      if (!diaDestino) {
        await setDoc(refDestino, {
          data: novaData, origem: "transferencia", criadoEm: serverTimestamp(), atualizadoEm: serverTimestamp(), pesoLiquido: novoPesoDestino, cargas: listaDestinoAtualizada
        });
      } else {
        await updateDoc(refDestino, { cargas: listaDestinoAtualizada, pesoLiquido: novoPesoDestino, atualizadoEm: serverTimestamp() });
      }

      window.mostrarCliente(`✅ Carga #${numeroCarga} transferida para ${fmtData(novaData)}!`);
      iniciarListener();

    } catch (e) {
      alert("❌ Erro ao transferir carga: " + e.message);
      console.error(e);
    }
  }

  /* EDITAR CLIENTE */
  async function editarCliente(dataISO, numeroCarga) {
    const nomeAtual = obterNomeCliente(dataISO, numeroCarga) || "";
    
    const novoNome = prompt(`Editar cliente da carga #${numeroCarga} (${fmtData(dataISO)}):`, nomeAtual);
    if (novoNome === null) return;

    try {
      const docRef = doc(db, "configuracoes", "mapeamento_cargas");
      const docSnap = await getDoc(docRef);
      let data = docSnap.exists() ? docSnap.data() : {};
      
      if (!data.porData) data.porData = {};
      if (!data.porData[dataISO]) data.porData[dataISO] = {};
      
      if (novoNome.trim() === "") {
        delete data.porData[dataISO][numeroCarga];
      } else {
        data.porData[dataISO][numeroCarga] = novoNome.trim();
      }
      
      await setDoc(docRef, data);
      window.mostrarCliente(`✅ Cliente atualizado!`);
    } catch (e) { alert("❌ Erro ao atualizar cliente: " + e.message); }
  }

  /* EDITAR QUANTIDADE DO PRODUTO COM ABATIMENTO DE PESO */
  async function editarQuantidadeProduto(dataISO, numCarga, indexProduto) {
    const dia = dias.find(d => d.data === dataISO);
    if (!dia) return;
    
    const carga = dia.cargas.find(c => String(c.numeroCarga) === String(numCarga));
    if (!carga || !carga.produtos[indexProduto]) return;

    const produto = carga.produtos[indexProduto];
    const qtdAtual = Number(produto.quantidade) || 0;

    const novaQtdStr = prompt(`Editar quantidade de ${produto.nome} (${produto.unidade}):`, qtdAtual);
    if (novaQtdStr === null) return;

    const novaQtd = parseFloat(novaQtdStr.replace(",", "."));
    if (isNaN(novaQtd) || novaQtd < 0) { alert("❌ Quantidade inválida."); return; }
    if (novaQtd === qtdAtual) return;

    // PEGA O PESO UNITÁRIO DO DICIONÁRIO
    const pesoUnitario = PESOS_PRODUTOS[String(produto.codigo)] || 0;
    
    // CALCULA A DIFERENÇA DE PESO (Se diminuiu, o delta será negativo. Se aumentou, positivo)
    const deltaQtd = novaQtd - qtdAtual;
    const deltaPeso = deltaQtd * pesoUnitario;

    try {
      // 1. Atualiza a quantidade do produto
      produto.quantidade = novaQtd;
      
      // 2. Atualiza o peso da carga
      const novoPesoCarga = Number(carga.pesoLiquido || 0) + deltaPeso;
      carga.pesoLiquido = Math.max(0, novoPesoCarga); // Garante que não fique negativo
      
      // 3. Atualiza o peso total do dia
      let novoPesoDia = 0;
      
      // Recalcula o peso do dia inteiro para evitar erros de arredondamento
      dia.cargas.forEach(c => {
        if (String(c.numeroCarga) === String(numCarga)) {
          novoPesoDia += carga.pesoLiquido; // Usa o peso atualizado
        } else {
          novoPesoDia += Number(c.pesoLiquido || c.peso || 0);
        }
      });

      // Salva no Firebase
      const docRef = doc(db, "cargas", dataISO);
      await setDoc(docRef, {
        cargas: dia.cargas,
        pesoLiquido: novoPesoDia,
        atualizadoEm: serverTimestamp()
      }, { merge: true });

      window.mostrarCliente(`✅ Quantidade e peso atualizados!`);
    } catch (e) {
      alert("❌ Erro ao editar quantidade: " + e.message);
    }
  }

  document.getElementById("btnLimparPassados").addEventListener("click", async () => {
    const passados = dias.filter(d => d.data < hojeISO());
    if (!passados.length) return alert("✅ Não há cargas antigas.");

    const total = passados.reduce((a, d) => a + (d.cargas?.length || 0), 0);
    const ok = await pedirSenha("Limpar dias", `Apagar ${total} carga(s) de dias que já passaram.`);

    if (ok) {
      try {
        const batch = writeBatch(db);
        passados.forEach(d => batch.delete(doc(db, "cargas", d.data)));
        await batch.commit();
        passados.forEach(d => {
          delete filtroCargaPorDia[d.data];
          delete filtroProdutoPorDia[d.data];
        });
      } catch (e) { alert("❌ Erro: " + e.message); }
    }
  });

  /* FILTROS E ABAS */
  document.getElementById("filtroData").addEventListener("change", (e) => {
    filtroData = e.target.value;
    render();
  });

  document.getElementById("btnLimparFiltro").addEventListener("click", () => {

    render();
  });

  document.getElementById("btnDetalhado").addEventListener("click", () => setView("detalhado"));
  document.getElementById("btnResumo").addEventListener("click", () => setView("resumo"));

  function setView(v) {
    viewAtual = v;

    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".view").forEach(s => s.classList.remove("active"));

    document.getElementById(v === "detalhado" ? "btnDetalhado" : "btnResumo").classList.add("active");
    document.getElementById(v === "detalhado" ? "viewDetalhado" : "viewResumo").classList.add("active");

    render();
  }

  function getCargasFiltradas() {
    let l = [];

    dias.forEach(d => {
      (d.cargas || []).forEach(c => {
        const produtosComIndex = (c.produtos || []).map((p, index) => ({
          ...p,
          _indexOriginal: index 
        }));

        l.push({
          data: d.data,
          num: c.numeroCarga,
          pesoLiquido: c.pesoLiquido || 0,
          produtos: produtosComIndex
        });
      });
    });

    if (filtroData) l = l.filter(c => c.data >= filtroData);

    return l.sort((a, b) =>
      a.data === b.data
        ? String(a.num).localeCompare(String(b.num), undefined, { numeric: true })
        : a.data.localeCompare(b.data)
    );
  }

  function render() {
    const l = getCargasFiltradas();
    if (viewAtual === "detalhado") renderDetalhado(l);
    else renderResumo(l);
  }

  /* RENDERIZAÇÃO DA TABELA DETALHADA */
  function renderDetalhado(lista) {
    const tbody = document.querySelector("#tabelaDetalhado tbody");
    tbody.innerHTML = "";

    if (!lista.length) {
      tbody.innerHTML = `<tr><td colspan="6" class="vazio">Nenhuma carga programada.</td></tr>`;
      return;
    }

    let ant = null;

    lista.forEach(carga => {
      const p = carga.produtos || [];
      const nova = carga.data !== ant;
      const pesoDia = dias.find(d => d.data === carga.data)?.pesoLiquido || 0;
      const pesoFmt = pesoDia > 0 ? formatarPeso(pesoDia) : "";
      
      const nomeCli = obterNomeCliente(carga.data, carga.num);
      const cssClasse = nomeCli ? "has-cliente" : "";
      const titleAttr = nomeCli ? `title="Cliente: ${escapeHtml(nomeCli)}" onclick="mostrarCliente('${escapeHtml(nomeCli)}')"` : "";

      const acoesCarga = `
        <span class="carga-actions">
          <button class="btn-carga-acao" onclick="event.stopPropagation(); transferirCarga('${carga.data}', '${carga.num}')" title="Transferir para outro dia">↔</button>
          <button class="btn-carga-acao" onclick="event.stopPropagation(); editarCliente('${carga.data}', '${carga.num}')" title="Editar Cliente">✏️</button>
          <button class="btn-carga-acao del" onclick="event.stopPropagation(); apagarCarga('${carga.data}', '${carga.num}')" title="Apagar apenas esta carga">🗑</button>
        </span>
      `;

      if (!p.length) {
        tbody.innerHTML += `
          <tr class="${nova ? 'grupo-data' : ''}">
            <td class="data-cell">
              ${nova ? fmtData(carga.data) + " <small>" + diaSemana(carga.data) + "</small>" : ""}
              ${nova && pesoFmt ? `<span class="peso-dia">${pesoFmt} kg</span>` : ""}
              ${nova ? `<button class="btn-del-dia" data-data="${carga.data}">🗑</button>` : ""}
            </td>
            <td class="carga-cell ${cssClasse}" ${titleAttr}>${carga.num} ${acoesCarga}</td>
            <td colspan="4"><em>Sem produtos</em></td>
          </tr>
        `;
      } else {
        p.forEach((pr, idx) => {

              <td class="data-cell">
                ${nova && idx === 0 ? fmtData(carga.data) + " <small>" + diaSemana(carga.data) + "</small>" : ""}
                ${nova && idx === 0 && pesoFmt ? `<span class="peso-dia">${pesoFmt} kg</span>` : ""}
                ${nova && idx === 0 ? `<button class="btn-del-dia" data-data="${carga.data}">🗑</button>` : ""}
              </td>
              <td class="carga-cell ${cssClasse}" ${titleAttr}>${idx === 0 ? carga.num + acoesCarga : ""}</td>

              <td>${pr.nome}</td>

      ant = carga.data;

    tbody.querySelectorAll(".btn-del-dia").forEach(b => {

  /* RENDERIZAÇÃO DOS CARDS COM FILTROS E EDIÇÃO DE QTD */
  function renderResumo(lista) {
    const cnt = document.getElementById("cardsResumo");
    cnt.innerHTML = "";

    if (!lista.length) {
      cnt.innerHTML = `<div class="vazio">Nenhuma carga programada.</div>`;
      return;
    }

    const porData = {};

    lista.forEach(c => {
      if (!porData[c.data]) {
        porData[c.data] = { produtos: {}, cargas: [], produtosPorCarga: {} };
      }

      porData[c.data].cargas.push(c.num);
      porData[c.data].produtosPorCarga[String(c.num)] = c.produtos;

      c.produtos.forEach(p => {
        const k = `${p.codigo}||${p.nome}||${p.unidade || ""}`;
        if (!porData[c.data].produtos[k]) {
          porData[c.data].produtos[k] = { codigo: p.codigo, nome: p.nome, unidade: p.unidade, total: 0 };
        }
        porData[c.data].produtos[k].total += Number(p.quantidade) || 0;
      });
    });

    Object.keys(porData).sort().forEach(d => {
      const inf = porData[d];
      const pDia = dias.find(dia => dia.data === d)?.pesoLiquido || 0;

      const cargaFiltrada = filtroCargaPorDia[d];
      const temFiltro = cargaFiltrada && inf.produtosPorCarga[cargaFiltrada];

      let produtosParaMostrar;

      if (temFiltro) {
        produtosParaMostrar = (inf.produtosPorCarga[cargaFiltrada] || []).map(p => ({
          codigo: p.codigo,
          nome: p.nome,
          unidade: p.unidade,
          total: Number(p.quantidade) || 0,
          _indexOriginal: p._indexOriginal 
        }));
      } else {
        produtosParaMostrar = Object.values(inf.produtos);
      }

      const produtoFiltrado = filtroProdutoPorDia[d];
      const produtoSelecionado = Object.values(inf.produtos).find(p => chaveProduto(p) === produtoFiltrado);
      const temFiltroProduto = Boolean(produtoSelecionado);

      const cargasParaMostrar = inf.cargas.filter(n =>
        !temFiltroProduto || (inf.produtosPorCarga[String(n)] || []).some(p => chaveProduto(p) === produtoFiltrado)
      );

      const tags = cargasParaMostrar
        .sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }))
        .map(n => {
          const nStr = String(n);
          const nomeCli = obterNomeCliente(d, n);
          const cssClasse = nomeCli ? "has-cliente" : "";
          const ativa = temFiltro && nStr === String(cargaFiltrada);

          let onclick = `toggleFiltroCarga('${d}', '${nStr}')`;
          if (nomeCli) onclick += `; mostrarCliente('${escapeHtml(nomeCli).replace(/'/g, "\\'")}')`;

          const titleAttr = nomeCli ? `title="Cliente: ${escapeHtml(nomeCli)}"` : "";

          return `
            <div class="carga-tag ${cssClasse} ${ativa ? 'ativa' : ''}" ${titleAttr} onclick="${onclick}">
              <span>${n}</span>
              <div class="tag-actions">
                <button class="tag-btn" onclick="event.stopPropagation(); transferirCarga('${d}', '${nStr}')" title="Transferir">↔</button>
                <button class="tag-btn" onclick="event.stopPropagation(); apagarCarga('${d}', '${nStr}')" title="Apagar">🗑</button>
              </div>
            </div>
          `;
        })
        .join("");

      // FILTRA OS ZERADOS SE NÃO ESTIVER NO MODO DE EDIÇÃO
      const produtosVisiveis = produtosParaMostrar.filter(p => {
        if (temFiltro) return true; // No modo edição, mostra tudo
        return p.total > 0;         // No modo normal, esconde os zerados
      });

      const htmlProdutos = produtosVisiveis
        .sort((a, b) => a.nome.localeCompare(b.nome))
        .map(p => {
          const produtoAtivo = temFiltroProduto && chaveProduto(p) === produtoFiltrado;
          const estaZerado = p.total === 0;

          return `
            <div class="produto-linha ${estaZerado ? 'zerado' : ''}">
              <button
                type="button"
                class="p-nome ${produtoAtivo ? 'ativo' : ''}"
                data-dia="${escapeHtml(d)}"
                data-produto="${escapeHtml(chaveProduto(p))}"
                aria-pressed="${produtoAtivo}"
                title="Filtrar cargas com este produto"
              >
                <small class="p-cod">${escapeHtml(p.codigo)}</small>
                ${escapeHtml(p.nome)}
              </button>

              <span class="qtd" style="display:flex; align-items:center; gap:6px;">
                ${p.total.toLocaleString("pt-BR")}
                <small>${p.unidade || ""}</small>
                ${temFiltro ? `
                  <button 
                    class="btn-carga-acao" 
                    style="padding:2px 4px; font-size:0.75rem; opacity:0.8;" 
                    onclick="editarQuantidadeProduto('${d}', '${cargaFiltrada}', ${p._indexOriginal})" 
                    title="Editar Quantidade Parcial">
                    ✏️
                  </button>
                ` : ""}
              </span>
            </div>
          `;
        })
        .join("") || `
          <div class="produto-linha"><em>Nenhum produto ativo.</em></div>
        `;

      const filtroHtml = temFiltro ? `
        <div class="filtro-ativo">
          <span>🔎 Filtrando carga <strong>${cargaFiltrada}</strong> (Modo de Edição Ativado)</span>
          <button onclick="limparFiltroCarga('${d}')">✕ Limpar</button>
        </div>
      ` : "";

      const filtroProdutoHtml = temFiltroProduto ? `
        <div class="filtro-ativo">
          <span>🔎 Cargas com <strong>${escapeHtml(produtoSelecionado.nome)}</strong></span>
          <button type="button" data-dia="${escapeHtml(d)}" data-limpar-produto>✕ Limpar produto</button>
        </div>
      ` : "";

      cnt.innerHTML += `
        <div class="card-dia ${temFiltro || temFiltroProduto ? 'filtrado' : ''}">
          <div class="card-header">
            <span>${fmtData(d)} — ${diaSemana(d)}</span>
            <div class="card-header-actions">
              ${pDia > 0 ? `<span class="badge-peso">${formatarPeso(pDia)} kg</span>` : ""}
              <span class="badge">${inf.cargas.length} carga(s)</span>
              <button class="btn-del-dia-card" data-data="${d}">🗑</button>
            </div>
          </div>

          <div class="card-body">
            ${filtroHtml}
            ${htmlProdutos}
            ${filtroProdutoHtml}

            <div class="cargas-lista">
              <h4>Nº das Cargas${temFiltroProduto ? ` (${cargasParaMostrar.length} de ${inf.cargas.length})` : ""}</h4>
              <div class="cargas-tags">${tags}</div>
            </div>
          </div>
        </div>
      `;
    });

    cnt.querySelectorAll(".btn-del-dia-card").forEach(b => {
      b.addEventListener("click", () => apagarDia(b.dataset.data));
    });
  }

  window.apagarCarga = apagarCarga;
  window.transferirCarga = transferirCarga;
  window.editarCliente = editarCliente;
  window.editarQuantidadeProduto = editarQuantidadeProduto;
</script>
</body>
</html>
