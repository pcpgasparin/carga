<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programação de Cargas</title>
<style>
  /* =========================================================
     RESET E ESTILOS GERAIS
     ========================================================= */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif; 
    background: #eef1f6; 
    color: #1e2a3a; 
    padding: 18px; 
    font-size: 15px; 
  }

  /* =========================================================
     HEADER COM LOGO E CONTROLES
     ========================================================= */
  header { 
    background: linear-gradient(135deg, #1e2a3a 0%, #2b3a4f 100%); 
    color: #fff; 
    padding: 22px 26px; 
    border-radius: 14px; 
    margin-bottom: 18px; 
    box-shadow: 0 6px 20px rgba(30,42,58,.18); 
    display: grid; 
    grid-template-columns: auto 1fr auto; 
    align-items: center; 
    gap: 20px; 
    position: relative; 
  }
  header::after { content: ""; width: 140px; height: 1px; visibility: hidden; }
  
  .logo-area { display: flex; align-items: center; justify-content: flex-start; }
  .logo { 
    max-height: 70px; 
    max-width: 140px; 
    object-fit: contain; 
    border-radius: 8px; 
    transition: transform .2s ease; 
    background: rgba(255,255,255,.95); 
    padding: 0.5px; 
  }
  .logo:hover { transform: scale(1.03); }
  
  .header-center { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .header-center h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }

  /* =========================================================
     BOTÕES E STATUS
     ========================================================= */
  .tab { 
    background: rgba(255,255,255,.08); 
    color: #cfd8e3; 
    border: 1px solid rgba(255,255,255,.12); 
    padding: 9px 18px; 
    border-radius: 8px; 
    cursor: pointer; 
    font-size: .9rem; 
    font-weight: 600; 
    transition: all .18s ease; 
    font-family: inherit; 
  }
  .tab:hover { background: rgba(255,255,255,.16); color: #fff; }
  .tab.active { background: #4a90e2; color: #fff; border-color: #4a90e2; box-shadow: 0 3px 10px rgba(74,144,226,.4); }
  
  input[type="date"] { 
    padding: 9px 12px; 
    border-radius: 8px; 
    border: 1px solid rgba(255,255,255,.18); 
    background: rgba(255,255,255,.08); 
    color: #fff; 
    font-family: inherit; 
    font-size: .88rem; 
  }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
  
  .btn-sec, .btn-nav { 
    padding: 9px 16px; 
    border-radius: 8px; 
    cursor: pointer; 
    font-weight: 600; 
    font-size: .88rem; 
    font-family: inherit; 
    border: none; 
    text-decoration: none; 
    display: inline-flex; 
    align-items: center; 
    gap: 6px; 
    transition: all .18s ease; 
  }
  .btn-sec { background: rgba(255,255,255,.12); color: #dfe6ee; }
  .btn-sec:hover { background: rgba(255,255,255,.22); color: #fff; }
  .btn-nav { background: #4a90e2; color: #fff; }
  .btn-nav:hover { background: #3a78c2; }
  
  .status { font-size: .82rem; padding: 7px 14px; border-radius: 20px; background: rgba(255,255,255,.1); color: #fff; font-weight: 600; }
  .status.ok { background: rgba(31,122,63,.85); }
  .status.erro { background: rgba(160,48,48,.9); }

  .view { display: none; } 
  .view.active { display: block; }

  /* =========================================================
     TABELA DETALHADA
     ========================================================= */
  .table-wrapper { 
    background: #fff; 
    border-radius: 14px; 
    box-shadow: 0 4px 16px rgba(30,42,58,.08); 
    max-height: 78vh; 
    overflow: auto; 
    border: 1px solid #e4e9f0; 
  }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  thead { position: sticky; top: 0; background: #4a90e2; color: #fff; z-index: 2; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  thead th { padding: 13px 16px; text-align: left; font-weight: 600; font-size: .82rem; text-transform: uppercase; letter-spacing: .5px; }
  thead th:nth-child(5), thead th:nth-child(6) { text-align: right; }
  tbody td { padding: 11px 16px; border-bottom: 1px solid #eef2f7; vertical-align: middle; }
  tbody tr:hover { background: #f5faff; }
  tr.grupo-data td { border-top: 2px solid #4a90e2; }
  tr.grupo-data:first-child td { border-top: none; }
  
  .data-cell { font-weight: 700; color: #1e2a3a; white-space: nowrap; font-size: .9rem; position: relative; vertical-align: top; }
  .data-cell small { display: block; color: #7a8699; font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .3px; margin-top: 2px; }
  
  .carga-cell { font-family: 'Consolas', monospace; color: #2a5d9e; font-weight: 700; font-size: .95rem; }
  .qtd-cell { text-align: right; font-weight: 700; color: #1f7a3f; font-variant-numeric: tabular-nums; }
  tbody td:nth-child(6) { text-align: right; color: #667; font-size: .85rem; font-weight: 600; }
  tbody td:nth-child(3) { font-family: 'Consolas', monospace; color: #6c7a8c; font-size: .85rem; }
  tr.inicio-carga td { border-top: 1px solid #d9e6f7; background: #f9fcff; }
  tr.inicio-carga:hover td { background: #f0f7ff; }
  .vazio { text-align: center; padding: 50px 20px; color: #889; font-style: italic; }

  /* =========================================================
     MÁGICA DO CLIENTE (TOOLTIP & TOAST PROCV)
     ========================================================= */
  .has-cliente {
    cursor: pointer;
    text-decoration: underline dotted #4a90e2;
    text-underline-offset: 4px;
    position: relative;
    transition: background 0.2s;
  }
  .has-cliente:hover { 
    background: #eef4fc; 
    border-radius: 4px; 
  }
  
  /* TOAST NOVO (AVISO NO CELULAR E DESKTOP) */
  #toastCliente {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #4a90e2;
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 0.95rem;
    box-shadow: 0 10px 25px rgba(74, 144, 226, 0.4);
    transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    z-index: 10000;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    max-width: 90vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #toastCliente.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .peso-dia { display: inline-block; background: #e5f6ec; color: #1f7a3f; padding: 3px 10px; border-radius: 6px; font-family: 'Consolas', monospace; font-size: .8rem; font-weight: 700; margin-top: 6px; margin-right: 6px; border: 1px solid #c8e6d2; }
  .badge-peso { background: #1f7a3f; color: #fff; padding: 4px 11px; border-radius: 20px; font-size: .75rem; font-weight: 700; white-space: nowrap; font-family: 'Consolas', monospace; }

  /* =========================================================
     CARDS DE RESUMO
     ========================================================= */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card-dia { background: #fff; border-radius: 14px; box-shadow: 0 4px 16px rgba(30,42,58,.08); overflow: hidden; border-top: 4px solid #4a90e2; transition: transform .15s ease, box-shadow .15s ease; }
  .card-dia:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(30,42,58,.12); }
  
  .card-header { background: #1e2a3a; color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .card-header > span:first-child { font-weight: 700; font-size: .95rem; line-height: 1.3; }
  .card-header-actions { display: flex; align-items: center; gap: 8px; }
  .card-header .badge { background: #4a90e2; padding: 4px 11px; border-radius: 20px; font-size: .75rem; font-weight: 700; white-space: nowrap; }
  
  .card-body { padding: 6px 18px 18px; }
  .produto-linha { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px dashed #e8ecf2; gap: 12px; font-size: .9rem; }
  .produto-linha:last-child { border-bottom: none; }
  .produto-linha .p-nome { display: flex; flex-direction: column; line-height: 1.3; }
  .produto-linha .p-cod { font-family: 'Consolas', monospace; color: #7a8699; font-size: .72rem; font-weight: 600; margin-bottom: 1px; }
  .produto-linha .qtd { font-weight: 700; color: #1f7a3f; white-space: nowrap; font-variant-numeric: tabular-nums; font-size: .95rem; }
  .produto-linha .qtd small { color: #889; font-weight: 600; font-size: .72rem; margin-left: 3px; }
  
  .cargas-lista { margin-top: 14px; padding-top: 12px; border-top: 1px solid #eef2f7; }
  .cargas-lista h4 { font-size: .72rem; text-transform: uppercase; color: #7a8699; margin-bottom: 8px; font-weight: 700; }
  .cargas-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .carga-tag { background: #eef4fc; color: #2a5d9e; padding: 4px 10px; border-radius: 6px; font-family: 'Consolas', monospace; font-size: .78rem; font-weight: 700; border: 1px solid #d9e6f7; transition: background 0.2s; }
  
  /* =========================================================
     BOTÕES DE LIXEIRA E MODAL
     ========================================================= */
  .btn-del-dia, .btn-del-dia-card { background: transparent; border: none; cursor: pointer; padding: 4px 6px; border-radius: 6px; font-size: .95rem; opacity: 0; transition: all .15s ease; line-height: 1; }
  tr.grupo-data:hover .btn-del-dia, tr:hover .btn-del-dia { opacity: .35; }
  .btn-del-dia:hover { opacity: 1 !important; background: #fbe9e9; transform: scale(1.15); }
  .btn-del-dia-card { opacity: .55; color: #fff; font-size: 1rem; }
  .btn-del-dia-card:hover { opacity: 1; background: rgba(160,48,48,.9); transform: scale(1.1); }
  .data-cell .btn-del-dia { margin-left: 6px; vertical-align: middle; }
  
  .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 35, .6); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; animation: fadeIn .15s ease; }
  .modal-box { background: #fff; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35); width: 100%; max-width: 420px; overflow: hidden; animation: slideUp .2s ease; }
  .modal-header { background: #1e2a3a; color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: .98rem; }
  .modal-close { background: transparent; border: none; color: #cfd8e3; cursor: pointer; font-size: 1rem; padding: 4px 8px; border-radius: 6px; transition: all .15s; }
  .modal-body { padding: 20px; }
  .modal-msg { font-size: .9rem; color: #445; line-height: 1.5; margin-bottom: 16px; }
  .modal-label { display: block; font-size: .8rem; text-transform: uppercase; color: #7a8699; font-weight: 700; margin-bottom: 6px; }
  .modal-input { width: 100%; padding: 11px 14px; border: 1px solid #ccd5e0; border-radius: 8px; font-size: 1rem; font-family: inherit; }
  .modal-erro { color: #a03030; font-size: .85rem; font-weight: 600; margin-top: 8px; min-height: 18px; }
  .modal-footer { padding: 14px 20px 18px; display: flex; justify-content: flex-end; gap: 10px; background: #f9fbfd; border-top: 1px solid #eef2f7; }
  .btn-sec-modal { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; background: #eef2f7; color: #445; }
  .btn-danger-modal { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; background: #a03030; color: #fff; }
  
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } } 
  @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* RESPONSIVIDADE */
  @media (max-width: 900px) { 
    header { grid-template-columns: 1fr; justify-items: center; padding: 18px; } 
    header::after { display: none; } 
  }
  @media (max-width: 720px) { 
    body { padding: 10px; } 
    header { padding: 16px; } 
    .header-center h1 { font-size: 1.2rem; } 
    thead th, tbody td { padding: 9px 10px; font-size: .82rem; } 
    .cards { grid-template-columns: 1fr; } 
  }
</style>
</head>
<body>

<header>
  <div class="logo-area"><img src="logo.jpg" alt="Logo" class="logo"></div>
  <div class="header-center">
    <h1>📦 Programação de Cargas</h1>
    <div class="controls">
      <button id="btnDetalhado" class="tab active">Detalhado</button>
      <button id="btnResumo" class="tab">Resumo por Dia</button>
      <input type="date" id="filtroData" title="Filtrar a partir de">
      <button id="btnLimparFiltro" class="btn-sec">Limpar Filtro</button>
      <button id="btnAtualizar" class="btn-sec">🔄 Atualizar</button>
      <button id="btnLimparPassados" class="btn-sec">🧹 Limpar dias passados</button>
      <a href="importador.html" class="btn-nav">📥 Importador</a>
      <span id="statusConexao" class="status">🔄 Conectando...</span>
    </div>
  </div>
</header>

<main>
  <!-- VIEW TABELA DETALHADA -->
  <section id="viewDetalhado" class="view active">
    <div class="table-wrapper">
      <table id="tabelaDetalhado">
        <thead>
          <tr>
            <th>Data</th>
            <th>Nº Carga</th>
            <th>Cód</th>
            <th>Produto</th>
            <th>Qtd</th>
            <th>Un</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  
  <!-- VIEW CARDS DE RESUMO -->
  <section id="viewResumo" class="view">
    <div id="cardsResumo" class="cards"></div>
  </section>

  <!-- TOAST DE AVISO (Aparece ao clicar na carga no celular) -->
  <div id="toastCliente"></div>
</main>

<script type="module">
  import { db } from "./firebase-config.js";
  import { collection, onSnapshot, query, orderBy, doc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const SENHA_APAGAR = "pcp"; // 🔑 Senha para apagar dias
  
  let dias = [];
  let mapeamentoClientes = {}; 
  let viewAtual = "detalhado";
  let filtroData = "";
  let unsubscribe = null;
  const statusEl = document.getElementById("statusConexao");

  /* =========================================================
     HELPERS E FORMATAÇÃO
     ========================================================= */
  const fmtData = (iso) => iso ? iso.split("-").reverse().join("/") : "";
  const diaSemana = (iso) => ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"][new Date(iso + "T00:00:00").getDay()];
  const hojeISO = () => { const d = new Date(), mm = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0"); return `${d.getFullYear()}-${mm}-${dd}`; };
  const formatarPeso = (valor) => Number(valor || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  /* =========================================================
     FUNÇÃO GLOBAL: TOAST DE CLIENTE (MOBILE / CLICK)
     ========================================================= */
  window.mostrarCliente = function(nome) {
    const toast = document.getElementById("toastCliente");
    toast.textContent = "🏢 " + nome;
    toast.classList.add("show");
    
    if (window.toastTimeout) clearTimeout(window.toastTimeout);
    window.toastTimeout = setTimeout(() => {
      toast.classList.remove("show");
    }, 3000);
  };

  /* =========================================================
     MODAL DE SENHA PARA EXCLUSÃO
     ========================================================= */
  function pedirSenha(titulo, mensagem) {
    return new Promise((resolve) => {
      const overlay = document.createElement("div"); 
      overlay.className = "modal-overlay";
      
      overlay.innerHTML = `
        <div class="modal-box" role="dialog" aria-modal="true">
          <div class="modal-header">
            <span>🔒 ${titulo}</span>
            <button class="modal-close" type="button" aria-label="Fechar">✕</button>
          </div>
          <div class="modal-body">
            <p class="modal-msg">${mensagem}</p>
            <label class="modal-label">Senha de administrador</label>
            <input type="password" class="modal-input" id="modalSenhaInput" autocomplete="off" autofocus>
            <div class="modal-erro" id="modalErro"></div>
          </div>
          <div class="modal-footer">
            <button class="btn-sec-modal" type="button" data-cancelar>Cancelar</button>
            <button class="btn-danger-modal" type="button" data-confirmar>Confirmar</button>
          </div>
        </div>
      `;
      
      document.body.appendChild(overlay);
      const input = overlay.querySelector("#modalSenhaInput"); 
      const erroEl = overlay.querySelector("#modalErro");
      setTimeout(() => input.focus(), 50);
      
      function fechar(resultado) { 
        overlay.classList.add("fechando"); 
        setTimeout(() => { overlay.remove(); resolve(resultado); }, 150); 
      }
      
      function tentarConfirmar() { 
        if (input.value === SENHA_APAGAR) fechar(true); 
        else { erroEl.textContent = "❌ Senha incorreta."; input.value = ""; input.focus(); } 
      }
      
      overlay.querySelector("[data-confirmar]").addEventListener("click", tentarConfirmar);
      overlay.querySelector("[data-cancelar]").addEventListener("click", () => fechar(false));
      overlay.querySelector(".modal-close").addEventListener("click", () => fechar(false));
      input.addEventListener("keydown", (e) => { 
        if (e.key === "Enter") tentarConfirmar(); 
        if (e.key === "Escape") fechar(false); 
      });
    });
  }

  /* =========================================================
     INICIALIZAÇÃO DO FIREBASE E LISTENERS
     ========================================================= */
  function iniciarListener() {
    if (unsubscribe) unsubscribe();
    statusEl.textContent = "🔄 Conectando..."; 
    statusEl.className = "status";
    
    unsubscribe = onSnapshot(query(collection(db, "cargas"), orderBy("data", "asc")), (snap) => {
      dias = snap.docs.map(d => ({ data: d.id, ...d.data() }));
      const total = dias.reduce((acc, d) => acc + (d.cargas?.length || 0), 0);
      statusEl.textContent = `🔥 Firebase (${dias.length} dia(s) • ${total} carga(s))`; 
      statusEl.className = "status ok";
      render();
    }, (err) => { 
      statusEl.textContent = "🔴 Erro"; 
      statusEl.className = "status erro"; 
      console.error(err);
    });

    onSnapshot(doc(db, "configuracoes", "mapeamento_cargas"), (docSnap) => {
      if (docSnap.exists()) {
        mapeamentoClientes = docSnap.data();
        render(); 
      }
    });
  }

  iniciarListener();
  document.getElementById("btnAtualizar").addEventListener("click", iniciarListener);

  /* =========================================================
     EXCLUSÃO E LIMPEZA
     ========================================================= */
  async function apagarDia(dataISO) {
    const dia = dias.find(d => d.data === dataISO); 
    if (!dia || !dia.cargas?.length) return;
    
    const ok = await pedirSenha("Apagar dia", `Vai apagar TODAS as ${dia.cargas.length} carga(s) de ${fmtData(dataISO)}.`);
    if (ok) {
      try { await deleteDoc(doc(db, "cargas", dataISO)); } 
      catch (e) { alert("❌ Erro: " + e.message); }
    }
  }

  document.getElementById("btnLimparPassados").addEventListener("click", async () => {
    const passados = dias.filter(d => d.data < hojeISO()); 
    if (!passados.length) return alert("✅ Não há cargas antigas.");
    
    const total = passados.reduce((a,d) => a + (d.cargas?.length||0), 0);
    const ok = await pedirSenha("Limpar dias", `Apagar ${total} carga(s) de dias que já passaram.`);
    
    if (ok) {
      try { 
        const batch = writeBatch(db); 
        passados.forEach(d => batch.delete(doc(db, "cargas", d.data))); 
        await batch.commit(); 
      } catch (e) { alert("❌ Erro: " + e.message); }
    }
  });

  /* =========================================================
     FILTROS E ABAS
     ========================================================= */
  document.getElementById("filtroData").addEventListener("change", (e) => { 
    filtroData = e.target.value; 
    render(); 
  });
  
  document.getElementById("btnLimparFiltro").addEventListener("click", () => { 
    filtroData = ""; 
    document.getElementById("filtroData").value = ""; 
    render(); 
  });
  
  document.getElementById("btnDetalhado").addEventListener("click", () => setView("detalhado"));
  document.getElementById("btnResumo").addEventListener("click", () => setView("resumo"));
  
  function setView(v) { 
    viewAtual = v; 
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active")); 
    document.querySelectorAll(".view").forEach(s => s.classList.remove("active")); 
    document.getElementById(v === "detalhado" ? "btnDetalhado" : "btnResumo").classList.add("active"); 
    document.getElementById(v === "detalhado" ? "viewDetalhado" : "viewResumo").classList.add("active"); 
    render(); 
  }

  function getCargasFiltradas() {
    let l = []; 
    dias.forEach(d => (d.cargas || []).forEach(c => l.push({ data: d.data, num: c.numeroCarga, produtos: c.produtos || [] })));
    if (filtroData) l = l.filter(c => c.data >= filtroData);
    return l.sort((a,b) => a.data === b.data ? String(a.num).localeCompare(String(b.num), undefined, {numeric:true}) : a.data.localeCompare(b.data));
  }

  function render() { 
    const l = getCargasFiltradas(); 
    viewAtual === "detalhado" ? renderDetalhado(l) : renderResumo(l); 
  }

  /* =========================================================
     RENDERIZAÇÃO - TABELA DETALHADA
     ========================================================= */
  function renderDetalhado(lista) {
    const tbody = document.querySelector("#tabelaDetalhado tbody"); 
    tbody.innerHTML = "";
    
    if (!lista.length) { 
      tbody.innerHTML = `<tr><td colspan="6" class="vazio">Nenhuma carga programada.</td></tr>`; 
      return; 
    }
    
    let ant = null;
    
    lista.forEach(carga => {
      const p = carga.produtos || [];
      const nova = carga.data !== ant;
      const pesoDia = dias.find(d => d.data === carga.data)?.pesoLiquido || 0;
      const pesoFmt = pesoDia > 0 ? formatarPeso(pesoDia) : "";
      
      const nomeCli = mapeamentoClientes[carga.num];
      const cssClasse = nomeCli ? "has-cliente" : "";
      
      // Adicionado o onclick="mostrarCliente(...)" para funcionar no celular ao tocar
      const titleAttr = nomeCli ? `title="Cliente: ${escapeHtml(nomeCli)}" onclick="mostrarCliente('${escapeHtml(nomeCli)}')"` : "";

      if (!p.length) {
        tbody.innerHTML += `
          <tr class="${nova ? 'grupo-data' : ''}">
            <td class="data-cell">
              ${nova ? fmtData(carga.data) + " <small>"+diaSemana(carga.data)+"</small>" : ""} 
              ${nova && pesoFmt ? `<span class="peso-dia">${pesoFmt} kg</span>` : ""} 
              ${nova ? `<button class="btn-del-dia" data-data="${carga.data}">🗑</button>` : ""}
            </td>
            <td class="carga-cell ${cssClasse}" ${titleAttr}>${carga.num}</td>
            <td colspan="4"><em>Sem produtos</em></td>
          </tr>
        `;
      } else {
        p.forEach((pr, idx) => {
          tbody.innerHTML += `
            <tr class="${nova && idx === 0 ? 'grupo-data' : ''} ${idx === 0 ? 'inicio-carga' : ''}">
              <td class="data-cell">
                ${nova && idx === 0 ? fmtData(carga.data) + " <small>"+diaSemana(carga.data)+"</small>" : ""} 
                ${nova && idx === 0 && pesoFmt ? `<span class="peso-dia">${pesoFmt} kg</span>` : ""} 
                ${nova && idx === 0 ? `<button class="btn-del-dia" data-data="${carga.data}">🗑</button>` : ""}
              </td>
              <td class="carga-cell ${cssClasse}" ${titleAttr}>${idx === 0 ? carga.num : ""}</td>
              <td>${pr.codigo}</td>
              <td>${pr.nome}</td>
              <td class="qtd-cell">${Number(pr.quantidade).toLocaleString("pt-BR")}</td>
              <td>${pr.unidade || ""}</td>
            </tr>
          `;
        });
      }
      ant = carga.data;
    });
    
    tbody.querySelectorAll(".btn-del-dia").forEach(b => b.addEventListener("click", () => apagarDia(b.dataset.data)));
  }

  /* =========================================================
     RENDERIZAÇÃO - CARDS DE RESUMO
     ========================================================= */
  function renderResumo(lista) {
    const cnt = document.getElementById("cardsResumo"); 
    cnt.innerHTML = "";
    
    if (!lista.length) { 
      cnt.innerHTML = `<div class="vazio">Nenhuma carga programada.</div>`; 
      return; 
    }
    
    const porData = {};
    lista.forEach(c => {
      if (!porData[c.data]) porData[c.data] = { produtos: {}, cargas: [] };
      porData[c.data].cargas.push(c.num);
      
      c.produtos.forEach(p => { 
        const k = `${p.codigo}||${p.nome}||${p.unidade||""}`; 
        if (!porData[c.data].produtos[k]) {
          porData[c.data].produtos[k] = { codigo: p.codigo, nome: p.nome, unidade: p.unidade, total: 0 }; 
        }
        porData[c.data].produtos[k].total += Number(p.quantidade) || 0; 
      });
    });
    
    Object.keys(porData).sort().forEach(d => {
      const inf = porData[d];
      const pDia = dias.find(dia => dia.data === d)?.pesoLiquido || 0;
      
      const tags = inf.cargas.sort((a,b) => String(a).localeCompare(String(b), undefined, {numeric:true})).map(n => {
        const nomeCli = mapeamentoClientes[n];
        const cssClasse = nomeCli ? "has-cliente" : "";
        
        // Adicionado o onclick também nas tags da aba de Resumo
        const titleAttr = nomeCli ? `title="Cliente: ${escapeHtml(nomeCli)}" onclick="mostrarCliente('${escapeHtml(nomeCli)}')"` : "";
        
        return `<span class="carga-tag ${cssClasse}" ${titleAttr}>${n}</span>`;
      }).join("");

      const htmlProdutos = Object.values(inf.produtos).sort((a,b) => a.nome.localeCompare(b.nome)).map(p => `
        <div class="produto-linha">
          <span class="p-nome"><small class="p-cod">${p.codigo}</small>${p.nome}</span>
          <span class="qtd">${p.total.toLocaleString("pt-BR")} <small>${p.unidade||""}</small></span>
        </div>
      `).join("") || `<div class="produto-linha"><em>Sem produtos</em></div>`;

      cnt.innerHTML += `
        <div class="card-dia">
          <div class="card-header">
            <span>${fmtData(d)} — ${diaSemana(d)}</span>
            <div class="card-header-actions">
              ${pDia > 0 ? `<span class="badge-peso">${formatarPeso(pDia)} kg</span>` : ""}
              <span class="badge">${inf.cargas.length} carga(s)</span>
              <button class="btn-del-dia-card" data-data="${d}">🗑</button>
            </div>
          </div>
          <div class="card-body">
            ${htmlProdutos}
            <div class="cargas-lista">
              <h4>Nº das Cargas</h4>
              <div class="cargas-tags">${tags}</div>
            </div>
          </div>
        </div>
      `;
    });
    
    cnt.querySelectorAll(".btn-del-dia-card").forEach(b => b.addEventListener("click", () => apagarDia(b.dataset.data)));
  }
</script>
</body>
